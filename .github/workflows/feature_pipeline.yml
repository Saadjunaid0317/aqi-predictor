name: Hourly AQI Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"     # runs at the top of every hour
  workflow_dispatch:         # lets us trigger it manually too, for testing

permissions:
  contents: write   # needed so the "Commit updated recent history" step can push

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest    # GitHub gives us a fresh Linux machine for this run

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline and push to Hopsworks
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python push_to_hopsworks.py

      - name: Commit updated recent history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recent_history.csv
          git diff --staged --quiet || git commit -m "Update recent history [automated]"
          git push